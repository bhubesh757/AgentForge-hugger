name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", "workers/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "workers/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@localhost:5432/agentforge
      REDIS_URL: redis://localhost:6379/0
      EXECUTION_DISPATCH: inline
      LLM_MOCK_MODE: "true"
      # Throwaway CI-only values (not secrets): generated per run below.
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ephemeral keys
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (non-blocking)
        continue-on-error: true
        run: uv run mypy app
      - name: Alembic migrations
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          retention-days: 7
